<!doctype html>
<!-- Modelo do /links-bio. Trocar os {{CAMPOS}}, as cores do :root e apagar os links que não existem. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NOME}} · links</title>
<meta name="description" content="{{DESCRICAO}}">
<meta name="theme-color" content="{{COR_FUNDO}}">
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family={{FONTE_URL}}&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: {{COR_FUNDO}};
    --card: {{COR_CARTAO}};
    --text: {{COR_TEXTO}};
    --muted: {{COR_APAGADA}};
    --accent: {{COR_DESTAQUE}};
    --on-accent: {{COR_SOBRE_DESTAQUE}};
    --line: color-mix(in srgb, var(--text) 12%, transparent);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100svh; background: var(--bg); color: var(--text); font: 400 16px/1.5 "{{FONTE}}", system-ui, sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 32px 16px 40px; display: flex; flex-direction: column; align-items: center; }
  .logo { width: min(200px, 56vw); height: auto; }
  h1 { font-size: 26px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; margin-top: 18px; text-align: center; }
  .frase { color: var(--muted); margin-top: 6px; text-align: center; }
  .links { width: 100%; display: grid; gap: 12px; margin-top: 26px; }
  .link { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 14px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); color: inherit; text-decoration: none; transition: transform .15s; }
  .link:active { transform: scale(.98); }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .link b { display: block; font-weight: 700; }
  .link small { display: block; color: var(--muted); font-size: 13px; }
  .principal { background: var(--accent); color: var(--on-accent); border: 0; }
  .principal small { color: inherit; opacity: .85; }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="img/logo.webp" alt="{{NOME}}">
  <h1>{{NOME}}</h1>
  <p class="frase">{{FRASE}}</p>

  <nav class="links" aria-label="Links">
    <a class="link principal" href="https://wa.me/{{WHATSAPP_NUMERO}}?text={{MENSAGEM_URL}}" data-link="whatsapp"><span><b>{{ACAO_PRINCIPAL}}</b><small>{{WHATSAPP_TEXTO}}</small></span></a>
    <a class="link" href="{{URL_SITE}}" data-link="site"><span><b>Site</b><small>{{SITE_RESUMO}}</small></span></a>
    <a class="link" href="{{URL_AVALIACOES}}" target="_blank" rel="noopener" data-link="avaliacoes"><span><b>Avaliações no Google</b><small>O que os clientes falam</small></span></a>
    <a class="link" href="{{URL_MAPA}}" target="_blank" rel="noopener" data-link="mapa"><span><b>Como chegar</b><small>{{ENDERECO_CURTO}}</small></span></a>
  </nav>

  <footer>{{ARROBA}}</footer>
</main>
</body>
</html>
